---
- name: Windows 11 Airgap 研修環境セットアップ
  hosts: windows
  gather_facts: false
  become: false

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/windows.yml

  pre_tasks:
    - name: SSH 接続確認
      ansible.windows.win_ping:

    - name: OS 情報を取得
      ansible.windows.win_shell: (Get-CimInstance Win32_OperatingSystem).Caption
      register: os_check
      changed_when: false

    - name: OS が Windows であることを確認
      ansible.builtin.assert:
        that:
          - "'Windows' in os_check.stdout"
        fail_msg: "このPlaybookはWindows OSでのみ実行可能です"

  roles:
    - win_podman
    - win_training

  post_tasks:
    - name: セットアップ完了メッセージ
      ansible.builtin.debug:
        msg: |
          ========================================
          研修環境のセットアップが完了しました！

          コントローラへの接続:
            ssh -p 2220 root@localhost
            パスワード: password

          研修コンテナ:
            controller: 172.20.0.10 (SSH port 2220)
            node1:      172.20.0.11
            node2:      172.20.0.12
            node3:      172.20.0.13
            lb:         172.20.0.14
          ========================================
