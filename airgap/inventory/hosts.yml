---
# 統合インベントリ（推奨）
# 全ホストの IP アドレスとパスワードをお客様環境に合わせて編集してください。
all:
  vars:
    ansible_user: root
    ansible_password: password
  children:
    repo_server:
      hosts:
        repo-server:
          ansible_host: 192.168.100.5
    rhel:
      hosts:
        rhel-target:
          ansible_host: 192.168.100.10
