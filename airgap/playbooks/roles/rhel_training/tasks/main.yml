---
- name: airgap コード配置ディレクトリを作成
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/airgap
    - /opt/airgap/scripts

- name: 採番スクリプトを配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/allocate.py"
    dest: /opt/airgap/scripts/allocate.py
    mode: '0755'

- name: デプロイスクリプトを配置
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/opt/airgap/{{ item.dest }}"
    mode: '0755'
  loop:
    - { src: "{{ playbook_dir }}/../deploy-training.sh", dest: "deploy-training.sh" }
    - { src: "{{ playbook_dir }}/../destroy-training.sh", dest: "destroy-training.sh" }

- name: Playbook・ロール・設定を配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/"
    dest: /opt/airgap/playbooks/
    mode: preserve

- name: インベントリを配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../inventory/"
    dest: /opt/airgap/inventory/
    mode: preserve

- name: group_vars を配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../group_vars/"
    dest: /opt/airgap/group_vars/
    mode: preserve

- name: ansible.cfg を配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../ansible.cfg"
    dest: /opt/airgap/ansible.cfg
    mode: '0644'

- name: python3-pip をインストール
  ansible.builtin.dnf:
    name: python3-pip
    state: present

- name: ansible-playbook がインストール済みか確認
  ansible.builtin.command: ansible-playbook --version
  register: ansible_check
  changed_when: false
  failed_when: false

- name: ansible-core をオフラインインストール
  ansible.builtin.pip:
    name: ansible-core
    extra_args: "--no-index --find-links={{ bundle_staging_dir }}/pip-packages/"
  when: ansible_check.rc != 0

- name: Ansible コレクションを配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../offline-resources/ansible-collections/"
    dest: /opt/airgap/offline-resources/ansible-collections/
    mode: '0644'

- name: Ansible コレクションをインストール
  ansible.builtin.shell: |
    for f in /opt/airgap/offline-resources/ansible-collections/*.tar.gz; do
      ansible-galaxy collection install "$f" --force 2>/dev/null
    done
  when: ansible_check.rc != 0
  changed_when: true

- name: リポジトリサーバーが設定されていることを確認
  ansible.builtin.assert:
    that:
      - repo_server_ip | default('') | length > 0
    fail_msg: >-
      repo_server_ip が未設定です。
      統合インベントリ (inventory/hosts.yml) に repo_server グループを含めるか、
      -e "repo_server_ip=<IP>" で指定してください。

- name: 研修用ディレクトリを作成
  ansible.builtin.file:
    path: "{{ training_base_dir }}"
    state: directory
    mode: '0755'

- name: 研修資材アーカイブの存在を確認
  ansible.builtin.stat:
    path: "{{ training_archive }}"
  register: archive_file

- name: tar コマンドの存在を確認
  ansible.builtin.command: which tar
  register: tar_check
  changed_when: false
  failed_when: false

- name: 研修資材を展開（tar使用）
  ansible.builtin.unarchive:
    src: "{{ training_archive }}"
    dest: "{{ training_base_dir }}"
    remote_src: true
    creates: "{{ training_dir }}/README.md"
  when:
    - archive_file.stat.exists
    - tar_check.rc == 0

- name: 研修資材を展開（Pythonフォールバック）
  ansible.builtin.command:
    cmd: >
      python3 -c "
      import tarfile, os, warnings;
      warnings.filterwarnings('ignore');
      os.makedirs('{{ training_base_dir }}', exist_ok=True);
      t = tarfile.open('{{ training_archive }}', 'r:gz');
      t.extractall('{{ training_base_dir }}', filter='data') if hasattr(tarfile, 'data_filter') else t.extractall('{{ training_base_dir }}')
      "
    creates: "{{ training_dir }}/README.md"
  when:
    - archive_file.stat.exists
    - tar_check.rc != 0

- name: コントローライメージをロード
  ansible.builtin.command:
    cmd: podman load -i {{ container_images_dir }}/training-controller.tar
  register: controller_load
  changed_when: "'Loaded image' in controller_load.stdout"

- name: Linuxノードイメージをロード
  ansible.builtin.command:
    cmd: podman load -i {{ container_images_dir }}/training-linux-node.tar
  register: node_load
  changed_when: "'Loaded image' in node_load.stdout"

- name: ロード済みイメージを確認
  ansible.builtin.command: podman images
  register: loaded_images
  changed_when: false

- name: ロード済みイメージ一覧を表示
  ansible.builtin.debug:
    msg: "{{ loaded_images.stdout_lines }}"

- name: セットアップ完了
  ansible.builtin.debug:
    msg: |
      ========================================
      Linux 演習サーバーの基盤セットアップが完了しました。

      コンテナイメージ: ロード済み
      スクリプト: /opt/airgap/deploy-training.sh
      Playbook: /opt/airgap/playbooks/deploy-my-env.yml

      受講者は SSH でこのサーバーにログインし、
      ./deploy-training.sh を実行して各自の演習環境を構築してください。
      ========================================
