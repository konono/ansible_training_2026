services:
  controller:
    build:
      context: ./controller
      dockerfile: Containerfile
    container_name: controller
    hostname: controller
    privileged: true
    ports:
      - "2220:22"
    volumes:
      - ../basic-intro/workspace:/root/basic-intro
      - ../basic-roles/workspace:/root/basic-roles
      - ../advanced/workspace:/root/advanced
      - ../homework/workspace:/root/homework
    networks:
      ansible_net:
        ipv4_address: 172.20.0.10

  node1:
    build:
      context: ./linux
      dockerfile: Containerfile
    container_name: node1
    hostname: node1
    privileged: true
    networks:
      ansible_net:
        ipv4_address: 172.20.0.11

  node2:
    build:
      context: ./linux
      dockerfile: Containerfile
    container_name: node2
    hostname: node2
    privileged: true
    networks:
      ansible_net:
        ipv4_address: 172.20.0.12

  node3:
    build:
      context: ./linux
      dockerfile: Containerfile
    container_name: node3
    hostname: node3
    privileged: true
    networks:
      ansible_net:
        ipv4_address: 172.20.0.13

  lb:
    build:
      context: ./linux
      dockerfile: Containerfile
    container_name: lb
    hostname: lb
    privileged: true
    networks:
      ansible_net:
        ipv4_address: 172.20.0.14

  # --- オプション: Windows ターゲット（Windows 11 ラップトップのみ） ---
