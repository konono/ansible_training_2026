---
# 非airgap（インターネット接続あり）環境用インベントリ
#
# airgap 版（hosts.yml）との違い:
#   - repo_server グループが無い（ローカルリポジトリサーバーは不要）
#   - airgap_mode: false を指定し、RHSM/CDN・PyPI・Galaxy から直接取得する
#
# 実行例:
#   ansible-playbook -i inventory/hosts-online.yml playbooks/distribute-resources.yml
#   ansible-playbook -i inventory/hosts-online.yml playbooks/rhel-setup.yml
all:
  vars:
    # 非airgap モード
    airgap_mode: false
    # コンテナイメージの調達方法: build（Containerfile からビルド）/ pull（レジストリから取得）
    container_image_mode: build
    # container_image_mode: pull の場合に指定する
    # container_image_registry: registry.example.com/training

    # 研修資材の取得方法: archive（コントローラで tar を生成して転送）/ git（演習サーバーで clone）
    training_source_mode: archive
    # training_source_mode: git の場合に指定する
    # training_git_repo: https://github.com/konono/ansible_training_2026.git
    # training_git_version: main

    # SSH 接続ユーザー（root または sudo 可能な一般ユーザー）
    ansible_user: admin
    ansible_password: password
    # 特権昇格の方法（become 自体は ansible.cfg + play レベルで有効化）
    ansible_become_method: sudo
    ansible_become_password: "{{ ansible_password }}"
  children:
    rhel:
      hosts:
        rhel-target:
          ansible_host: 192.168.130.10
    # Windows クライアントがある場合は以下を有効化
    # windows_clients:
    #   hosts:
    #     win-client-01:
    #       ansible_host: 192.168.130.20
    #       ansible_user: cocoon
    #       ansible_password: "changeme"
