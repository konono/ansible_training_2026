---
- name: "RHEL {{ rhel_major }} Airgap 研修環境セットアップ"
  hosts: rhel
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/rhel.yml

  pre_tasks:
    - name: OS が RHEL/CentOS 系であることを確認
      ansible.builtin.assert:
        that:
          - ansible_facts["os_family"] == "RedHat"
        fail_msg: "このPlaybookはRHEL/CentOS系OSでのみ実行可能です"

  roles:
    - common
    - rhel_podman
    - rhel_training

  post_tasks:
    - name: セットアップ完了メッセージ
      ansible.builtin.debug:
        msg: |
          ========================================
          Linux 演習サーバーの基盤セットアップが完了しました。

          各受講者は SSH でこのサーバーにログインし、
          以下のコマンドで演習環境を構築してください:

            ssh root@{{ ansible_facts["default_ipv4"]["address"] | default(hostvars[inventory_hostname]["ansible_host"]) }}
            cd /opt/airgap
            ./deploy-training.sh
          ========================================
