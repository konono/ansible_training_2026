---
- name: バンドルステージングディレクトリを作成
  ansible.builtin.file:
    path: "{{ bundle_staging_dir }}"
    state: directory
    mode: '0755'

- name: チェックサムファイルの存在を確認
  ansible.builtin.stat:
    path: "{{ bundle_staging_dir }}/checksums.sha256"
  register: checksums_file

- name: チェックサムを検証（転送済みファイルのみ）
  ansible.builtin.shell: |
    cd "{{ bundle_staging_dir }}"
    total=0; pass=0; fail=0
    while IFS= read -r line; do
      file=$(echo "$line" | awk '{print $2}')
      if [ -f "$file" ]; then
        total=$((total + 1))
        if echo "$line" | sha256sum -c --quiet - 2>/dev/null; then
          pass=$((pass + 1))
        else
          fail=$((fail + 1))
          echo "MISMATCH: $file"
        fi
      fi
    done < checksums.sha256
    echo "RESULT: $pass/$total passed, $fail failed"
    [ "$fail" -eq 0 ]
  when: checksums_file.stat.exists
  changed_when: false
  register: checksum_result

- name: チェックサム検証結果を表示
  ansible.builtin.debug:
    msg: >-
      チェックサム検証: {{ 'OK' if checksum_result.rc | default(1) == 0
      else 'スキップ（checksums.sha256 なし）' if not checksums_file.stat.exists
      else '失敗 — ' + (checksum_result.stdout_lines | select('match', 'MISMATCH') | list | join(', ')) }}

- name: チェックサム不一致の場合はエラー
  ansible.builtin.fail:
    msg: "チェックサム検証に失敗しました。バンドルファイルが破損しています。再転送してください。"
  when:
    - checksums_file.stat.exists
    - checksum_result.rc | default(1) != 0
