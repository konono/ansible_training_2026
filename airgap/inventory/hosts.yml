---
# 統合インベントリ（推奨）
# 全ホストの IP アドレス・ユーザー・パスワードをお客様環境に合わせて編集してください。
all:
  vars:
    # SSH 接続ユーザー（root または sudo 可能な一般ユーザー）
    ansible_user: admin
    ansible_password: password
    # 特権昇格（ansible_user が root 以外の場合に必要）
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_password: "{{ ansible_password }}"
  children:
    repo_server:
      hosts:
        repo-server:
          ansible_host: 192.168.100.5
    rhel:
      hosts:
        rhel-target:
          ansible_host: 192.168.100.10
    # Windows クライアントがある場合は以下を有効化
    # windows_clients:
    #   hosts:
    #     win-client-01:
    #       ansible_host: 192.168.100.20
    #       ansible_user: cocoon
    #       ansible_password: "C@c#on160"
