---
- name: Windows クライアント端末セットアップ（nested VM 不可の場合）
  hosts: windows_clients
  gather_facts: false
  become: false

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/windows_clients.yml

  pre_tasks:
    - name: SSH 接続確認
      ansible.windows.win_ping:

    - name: OS 情報を取得
      ansible.windows.win_shell: (Get-CimInstance Win32_OperatingSystem).Caption
      register: os_check
      changed_when: false

    - name: OS が Windows であることを確認
      ansible.builtin.assert:
        that:
          - "'Windows' in os_check.stdout"
        fail_msg: "このPlaybookはWindows OSでのみ実行可能です"

  roles:
    - win_client_ssh
    - win_client_ansible
    - win_client_vscode

  post_tasks:
    - name: セットアップ完了メッセージ
      ansible.builtin.debug:
        msg: |
          ========================================
          Windows クライアントのセットアップが完了しました！

          ■ 研修環境への接続:
            [ターミナル]  ssh training
            [VSCode]     Ctrl+Shift+P → "Remote-SSH: Connect to Host" → "training"
            パスワード: {{ controller_password }}

          ■ Ansible コマンド（PowerShell から実行可能）:
            ansible --version
            ansible -i inventory.yml all -m ping

          ■ 研修環境の構築（このWindows端末から実行可能）:
            cd C:\path\to\airgap
            ansible-playbook -i inventory/hosts.yml playbooks/rhel-setup.yml
          ========================================
