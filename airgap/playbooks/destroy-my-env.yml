---
- name: 自分の演習環境を削除
  hosts: rhel
  become: true
  gather_facts: false

  vars:
    training_username: "{{ training_username | default('') }}"
    client_ip: "{{ client_ip | default('') }}"
    allocate_script: /opt/airgap/scripts/allocate.py

  tasks:
    - name: training_username または client_ip が指定されていることを確認
      ansible.builtin.assert:
        that:
          - (training_username | length > 0) or (client_ip | length > 0)
        fail_msg: >
          training_username または client_ip が未指定です。
          deploy-training.sh destroy 経由で実行してください。

    - name: 自分の割当情報を取得（username）
      ansible.builtin.command:
        cmd: >
          python3 {{ allocate_script }}
          --username "{{ training_username }}"
          --action lookup
      register: my_alloc_raw
      changed_when: false
      failed_when: false
      when: training_username | length > 0

    - name: 自分の割当情報を取得（client_ip フォールバック）
      ansible.builtin.command:
        cmd: >
          python3 {{ allocate_script }}
          --client-ip "{{ client_ip }}"
          --action lookup
      register: my_alloc_ip_raw
      changed_when: false
      failed_when: false
      when: training_username | length == 0 and client_ip | length > 0

    - name: lookup 結果を統合
      ansible.builtin.set_fact:
        alloc_result: "{{ my_alloc_raw if (training_username | length > 0) else my_alloc_ip_raw }}"

    - name: 割当が見つからない場合はエラー
      ansible.builtin.fail:
        msg: >
          {% if training_username | length > 0 %}
          ユーザー {{ training_username }} に対応する環境が見つかりません。
          {% else %}
          IP {{ client_ip }} に対応する環境が見つかりません。
          {% endif %}
          既に削除済みか、未デプロイの可能性があります。
      when: alloc_result.rc != 0

    - name: 割当情報をパース
      ansible.builtin.set_fact:
        my_alloc: "{{ alloc_result.stdout | from_json }}"

    - name: 削除対象を表示
      ansible.builtin.debug:
        msg: "user_id={{ my_alloc.user_id }}, username={{ my_alloc.username | default('-') }}, status={{ my_alloc.status }}"

    - name: allocations を released に更新（username）
      ansible.builtin.command: >
        python3 {{ allocate_script }}
        --username "{{ my_alloc.username }}"
        --action release
      changed_when: true
      when: my_alloc.username | default('') | length > 0

    - name: allocations を released に更新（client_ip フォールバック）
      ansible.builtin.command: >
        python3 {{ allocate_script }}
        --client-ip "{{ my_alloc.client_ip }}"
        --action release
      changed_when: true
      when: my_alloc.username | default('') | length == 0

    - name: コンテナとネットワークを削除（docker-compose）
      ansible.builtin.command:
        cmd: /usr/local/bin/docker-compose -p user{{ my_alloc.user_id }} down --remove-orphans
        chdir: "/opt/training/user{{ my_alloc.user_id }}/ansible_training_2026/containers"
      environment:
        DOCKER_HOST: "unix:///run/podman/podman.sock"
      register: compose_down
      failed_when: false
      changed_when: compose_down.rc == 0

    - name: コンテナを個別停止・削除（docker-compose 失敗時のフォールバック）
      ansible.builtin.shell: |
        for c in user{{ my_alloc.user_id }}_controller user{{ my_alloc.user_id }}_node1 user{{ my_alloc.user_id }}_node2 user{{ my_alloc.user_id }}_node3 user{{ my_alloc.user_id }}_lb; do
          podman stop "$c" 2>/dev/null; podman rm -f "$c" 2>/dev/null
        done
        podman network rm user{{ my_alloc.user_id }}_ansible_net 2>/dev/null || true
      when: compose_down.rc != 0
      changed_when: true

    - name: 研修ディレクトリを削除
      ansible.builtin.file:
        path: "/opt/training/user{{ my_alloc.user_id }}"
        state: absent

    - name: 削除完了
      ansible.builtin.debug:
        msg: "user{{ my_alloc.user_id }} の環境を削除しました。user_id は再利用可能です。"
