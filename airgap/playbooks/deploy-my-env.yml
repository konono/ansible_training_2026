---
- name: 演習環境のセルフサービスデプロイ
  hosts: rhel
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: client_ip が指定されていることを確認
      ansible.builtin.assert:
        that:
          - client_ip is defined
          - client_ip | length > 0
        fail_msg: >
          client_ip が未指定です。deploy-training.sh 経由で実行してください。

    - name: client_ip が SSH 接続元またはテスト用 IP であることを確認
      ansible.builtin.assert:
        that:
          - client_ip == (lookup('env', 'SSH_CLIENT') | split(' ') | first)
            or client_ip is match('^198\\.51\\.100\\.')
        fail_msg: >
          client_ip ({{ client_ip }}) が SSH 接続元と一致しません。
          deploy-training.sh 経由で実行してください。
      when: lookup('env', 'SSH_CLIENT') | length > 0

    - name: repo_server_ip が設定されていることを確認
      ansible.builtin.assert:
        that:
          - repo_server_ip | default('') | length > 0
        fail_msg: >
          repo_server_ip が未設定です。インベントリに repo_server グループが
          含まれていることを確認してください。

    - name: 採番スクリプトの存在を確認
      ansible.builtin.stat:
        path: "{{ allocate_script | default('/opt/airgap/scripts/allocate.py') }}"
      register: script_check

    - name: 採番スクリプトが見つからない場合エラー
      ansible.builtin.fail:
        msg: >
          採番スクリプトが見つかりません。
          airgap/ ディレクトリが /opt/airgap/ に配置されていることを確認してください。
      when: not script_check.stat.exists

  roles:
    - rhel_training_multi
