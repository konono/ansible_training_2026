---
- name: OpenSSH Client が利用可能か確認
  ansible.windows.win_shell: |
    if (Get-Command ssh -ErrorAction SilentlyContinue) {
      $sshPath = (Get-Command ssh).Source
      Write-Output "AVAILABLE at $sshPath"
    } else {
      $cap = Get-WindowsCapability -Online -Name OpenSSH.Client* 2>$null
      Write-Output $cap.State
    }
  register: ssh_client_check
  changed_when: false

- name: OpenSSH Client を有効化
  ansible.windows.win_shell: |
    Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0 2>$null
    Write-Output "ENABLED"
  when: "'AVAILABLE' not in ssh_client_check.stdout and 'Installed' not in ssh_client_check.stdout"
  register: ssh_enable

- name: OpenSSH が PowerShell の PATH に含まれていることを確認
  ansible.windows.win_shell: |
    $sshDir = "$env:SystemRoot\System32\OpenSSH"
    $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
    if ($path -notlike "*$sshDir*") {
      [Environment]::SetEnvironmentVariable("Path", "$path;$sshDir", "Machine")
      Write-Output "ADDED_TO_PATH"
    } else {
      Write-Output "ALREADY_IN_PATH"
    }
  register: ssh_path
  changed_when: "'ADDED_TO_PATH' in ssh_path.stdout | default('')"

- name: .ssh ディレクトリを作成
  ansible.windows.win_shell: |
    $sshDir = "$env:USERPROFILE\.ssh"
    if (-not (Test-Path $sshDir)) {
      New-Item -Path $sshDir -ItemType Directory -Force | Out-Null
      Write-Output "CREATED"
    } else {
      Write-Output "EXISTS"
    }
  register: ssh_dir
  changed_when: "'CREATED' in ssh_dir.stdout | default('')"

- name: SSH config に研修環境の接続設定を追加
  ansible.windows.win_shell: |
    $configPath = "$env:USERPROFILE\.ssh\config"
    $entry = @"

    # Ansible 研修環境
    Host training
        HostName {{ rhel_target_ip }}
        Port {{ controller_ssh_port }}
        User {{ controller_user }}
        StrictHostKeyChecking no
        UserKnownHostsFile /dev/null
    "@

    if (Test-Path $configPath) {
      $content = Get-Content $configPath -Raw
      if ($content -match "Host training") {
        Write-Output "ALREADY_CONFIGURED"
      } else {
        Add-Content -Path $configPath -Value $entry
        Write-Output "ADDED"
      }
    } else {
      Set-Content -Path $configPath -Value $entry.TrimStart()
      Write-Output "CREATED"
    }
  register: ssh_config
  changed_when: "'ADDED' in ssh_config.stdout or 'CREATED' in ssh_config.stdout"

- name: SSH 接続テスト
  ansible.windows.win_shell: |
    $result = sshpass -p "{{ controller_password }}" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p {{ controller_ssh_port }} {{ controller_user }}@{{ rhel_target_ip }} "ansible --version" 2>$null | Select-Object -First 1
    if ($result -match "ansible") {
      Write-Output "SSH_OK: $result"
    } else {
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -p {{ controller_ssh_port }} {{ controller_user }}@{{ rhel_target_ip }} "ansible --version" 2>$null | Select-Object -First 1
      if ($LASTEXITCODE -eq 0) {
        Write-Output "SSH_OK_KEY"
      } else {
        Write-Output "SSH_MANUAL: ssh -p {{ controller_ssh_port }} {{ controller_user }}@{{ rhel_target_ip }} (password: {{ controller_password }})"
      }
    }
  register: ssh_test
  changed_when: false
  failed_when: false

- name: SSH 接続結果を表示
  ansible.builtin.debug:
    msg: "{{ ssh_test.stdout_lines | default(['SSH test skipped']) }}"
