---
- name: 演習環境のセルフサービスデプロイ
  hosts: rhel
  become: true
  gather_facts: true

  vars_files:
    - ../group_vars/all.yml

  pre_tasks:
    - name: training_username または client_ip が指定されていることを確認
      ansible.builtin.assert:
        that:
          - (training_username is defined and training_username | length > 0)
            or (client_ip is defined and client_ip | length > 0)
        fail_msg: >
          training_username または client_ip が未指定です。
          deploy-training.sh 経由で実行してください。

    - name: テストモードの client_ip バリデーション
      ansible.builtin.assert:
        that:
          - (lookup('env', 'ALLOW_TEST_IP') | default('0')) == '1'
        fail_msg: >
          テスト用 IP (198.51.100.*) はテストモード (--test) でのみ使用可能です。
      when:
        - client_ip is defined
        - client_ip is match('^198\\.51\\.100\\.')
        - training_username is not defined or training_username | length == 0

    - name: repo_server_ip が設定されていることを確認
      ansible.builtin.assert:
        that:
          - repo_server_ip | default('') | length > 0
        fail_msg: >
          repo_server_ip が未設定です。インベントリに repo_server グループが
          含まれていることを確認してください。

    - name: 採番スクリプトの存在を確認
      ansible.builtin.stat:
        path: "{{ allocate_script | default('/opt/airgap/scripts/allocate.py') }}"
      register: script_check

    - name: 採番スクリプトが見つからない場合エラー
      ansible.builtin.fail:
        msg: >
          採番スクリプトが見つかりません。
          airgap/ ディレクトリが /opt/airgap/ に配置されていることを確認してください。
      when: not script_check.stat.exists

  roles:
    - rhel_training_multi
