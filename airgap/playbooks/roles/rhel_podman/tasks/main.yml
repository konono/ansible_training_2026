---
- name: inotify max_user_instances を拡張（systemd コンテナ多数起動用）
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: '1024'
    sysctl_set: true
    state: present
    reload: true

- name: podman がインストール済みか確認
  ansible.builtin.command: podman --version
  register: podman_check
  changed_when: false
  failed_when: false

- name: リポジトリサーバーが設定されていることを確認（airgap のみ）
  ansible.builtin.assert:
    that:
      - repo_server_ip | default('') | length > 0
    fail_msg: >-
      repo_server_ip が未設定です。
      インベントリに repo_server グループを追加し、リポジトリサーバーを設定してください。
      非airgap 環境では airgap_mode=false を指定してください。
  when: airgap_mode | bool

- name: HTTP リポジトリを設定（airgap のみ）
  ansible.builtin.include_role:
    name: repository_management
  when: airgap_mode | bool

- name: 非airgap では既存のリポジトリ設定をそのまま使用
  ansible.builtin.debug:
    msg: "airgap_mode=false のため RHSM / 既存 dnf リポジトリをそのまま使用します。"
  when: not (airgap_mode | bool)

- name: podman をインストール
  ansible.builtin.dnf:
    name: podman
    state: present
  when: podman_check.rc != 0

- name: podman バージョンを確認
  ansible.builtin.command: podman --version
  register: podman_version
  changed_when: false

- name: podman バージョンを表示
  ansible.builtin.debug:
    msg: "podman {{ podman_version.stdout }}"

- name: podman.socket を有効化・起動
  ansible.builtin.systemd:
    name: podman.socket
    state: started
    enabled: true
  failed_when: false

- name: docker-compose が配置済みか確認
  ansible.builtin.stat:
    path: /usr/local/bin/docker-compose
  register: compose_installed

- name: docker-compose バイナリの存在を確認（バンドル）
  ansible.builtin.stat:
    path: "{{ docker_compose_binary }}"
  register: compose_src
  when: not compose_installed.stat.exists

- name: docker-compose バイナリを配置（バンドルから）
  ansible.builtin.copy:
    src: "{{ docker_compose_binary }}"
    dest: /usr/local/bin/docker-compose
    mode: '0755'
    remote_src: true
  when:
    - not compose_installed.stat.exists
    - compose_src.stat.exists | default(false)

- name: docker-compose バイナリをダウンロード（非airgap）
  ansible.builtin.get_url:
    url: "{{ docker_compose_url }}"
    dest: /usr/local/bin/docker-compose
    mode: '0755'
  when:
    - not (airgap_mode | bool)
    - not compose_installed.stat.exists
    - not (compose_src.stat.exists | default(false))

- name: docker-compose バージョンを確認
  ansible.builtin.command: /usr/local/bin/docker-compose version
  register: compose_version
  changed_when: false
  failed_when: false

- name: docker-compose バージョンを表示
  ansible.builtin.debug:
    msg: "{{ compose_version.stdout | default('docker-compose not available') }}"
