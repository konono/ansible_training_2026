---
- name: OpenSSH Client が利用可能か確認
  ansible.windows.win_shell: |
    if (Get-Command ssh -ErrorAction SilentlyContinue) {
      $sshPath = (Get-Command ssh).Source
      Write-Output "AVAILABLE at $sshPath"
    } else {
      $cap = Get-WindowsCapability -Online -Name OpenSSH.Client* 2>$null
      Write-Output $cap.State
    }
  register: ssh_client_check
  changed_when: false

- name: OpenSSH Client を有効化
  ansible.windows.win_shell: |
    Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0 2>$null
    Write-Output "ENABLED"
  when: "'AVAILABLE' not in ssh_client_check.stdout and 'Installed' not in ssh_client_check.stdout"
  register: ssh_enable

- name: OpenSSH が PowerShell の PATH に含まれていることを確認
  ansible.windows.win_shell: |
    $sshDir = "$env:SystemRoot\System32\OpenSSH"
    $path = [Environment]::GetEnvironmentVariable("Path", "Machine")
    if ($path -notlike "*$sshDir*") {
      [Environment]::SetEnvironmentVariable("Path", "$path;$sshDir", "Machine")
      Write-Output "ADDED_TO_PATH"
    } else {
      Write-Output "ALREADY_IN_PATH"
    }
  register: ssh_path
  changed_when: "'ADDED_TO_PATH' in ssh_path.stdout | default('')"

- name: .ssh ディレクトリを作成
  ansible.windows.win_shell: |
    $sshDir = "$env:USERPROFILE\.ssh"
    if (-not (Test-Path $sshDir)) {
      New-Item -Path $sshDir -ItemType Directory -Force | Out-Null
      Write-Output "CREATED"
    } else {
      Write-Output "EXISTS"
    }
  register: ssh_dir
  changed_when: "'CREATED' in ssh_dir.stdout | default('')"

- name: OpenSSH セットアップ完了
  ansible.builtin.debug:
    msg: "OpenSSH Client: 利用可能。デプロイ後に表示される SSH 接続情報を参照してください。"
