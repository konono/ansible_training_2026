---
- name: 受講者ユーザーの管理（ステートフル）
  hosts: rhel
  become: true
  gather_facts: false

  vars_files:
    - ../trainees.yml

  vars:
    training_group: training
    credentials_dir: "{{ playbook_dir }}/../credentials"
    trainees_file: "{{ playbook_dir }}/../trainees.yml"
    allocate_script: /opt/airgap/scripts/allocate.py
    sshd_allowusers_conf: /etc/ssh/sshd_config.d/60-allow-users.conf

  pre_tasks:
    - name: trainees リストを正規化（未定義・null を空リストに）
      ansible.builtin.set_fact:
        trainees: "{{ trainees | default([]) }}"

    - name: training グループを作成
      ansible.builtin.group:
        name: "{{ training_group }}"
        state: present

  tasks:
    # =========================================================
    # Phase 1: 入力解決
    # =========================================================

    - name: 変数を初期化
      ansible.builtin.set_fact:
        resolved_trainees: []
        final_trainees: []
        users_password_mismatch: []

    - name: ユーザー名を解決（メールアドレスのローカルパート抽出）
      ansible.builtin.set_fact:
        resolved_trainees: >-
          {{
            resolved_trainees + [{
              'original_username': item.username,
              'linux_user': item.linux_user | default(
                (item.username | regex_replace('@.*$', '')) if '@' in item.username
                else item.username
              ),
              'display_name': item.display_name | default(''),
              'password': item.password | default('')
            }]
          }}
      loop: "{{ trainees }}"
      loop_control:
        label: "{{ item.username }}"

    - name: Linux ユーザー名のバリデーション
      ansible.builtin.assert:
        that:
          - item.linux_user is match('^[a-z_][a-z0-9._-]*$')
          - item.linux_user | length <= 32
        fail_msg: >
          ユーザー名 "{{ item.linux_user }}" (元: {{ item.original_username }})
          は Linux ユーザー名として無効です。
          使用可能: 英小文字、数字、ドット、ハイフン、アンダースコア（先頭は英小文字または _）
      loop: "{{ resolved_trainees }}"
      loop_control:
        label: "{{ item.linux_user }}"

    - name: 各ユーザーのパスワードを確定（未設定ならランダム生成）
      ansible.builtin.set_fact:
        final_trainees: >-
          {{
            final_trainees + [{
              'original_username': item.original_username,
              'linux_user': item.linux_user,
              'display_name': item.display_name,
              'password': item.password if item.password else lookup('password', '/dev/null length=10 chars=ascii_letters,digits')
            }]
          }}
      loop: "{{ resolved_trainees }}"
      loop_control:
        label: "{{ item.linux_user }}"

    # =========================================================
    # Phase 2: 現状把握
    # =========================================================

    - name: training グループの既存メンバーを取得
      ansible.builtin.shell: |
        getent group {{ training_group }} 2>/dev/null | cut -d: -f4 | tr ',' '\n' | grep -v '^$' || true
      register: existing_members_raw
      changed_when: false

    - name: メンバーリストを整理
      ansible.builtin.set_fact:
        existing_members: "{{ existing_members_raw.stdout_lines | default([]) }}"
        desired_members: "{{ final_trainees | map(attribute='linux_user') | list }}"

    # =========================================================
    # Phase 3: 差分計算
    # =========================================================

    - name: 差分を計算
      ansible.builtin.set_fact:
        users_to_delete: "{{ existing_members | difference(desired_members) }}"
        users_to_create: "{{ desired_members | difference(existing_members) }}"
        users_to_keep: "{{ desired_members | intersect(existing_members) }}"

    - name: 差分サマリーを表示
      ansible.builtin.debug:
        msg: |
          === ユーザー管理差分 ===
          作成: {{ users_to_create | join(', ') or 'なし' }}
          維持: {{ users_to_keep | join(', ') or 'なし' }}
          削除: {{ users_to_delete | join(', ') or 'なし' }}

    # =========================================================
    # Phase 4: 削除処理
    # =========================================================

    - name: 削除対象ユーザーの演習環境を破棄
      when: users_to_delete | length > 0
      block:
        - name: 削除対象ユーザーの allocation を検索
          ansible.builtin.command:
            argv:
              - python3
              - "{{ allocate_script }}"
              - --username
              - "{{ item }}"
              - --action
              - lookup
          register: delete_alloc_results
          loop: "{{ users_to_delete }}"
          loop_control:
            label: "{{ item }}"
          changed_when: false
          failed_when: false

        - name: 稼働中の環境を停止・削除
          ansible.builtin.shell: |
            alloc='{{ item.stdout }}'
            user_id=$(echo "$alloc" | python3 -c "import json,sys; print(json.load(sys.stdin)['user_id'])" 2>/dev/null) || exit 0
            training_dir="/opt/training/user${user_id}/ansible_training_2026/containers"
            if [ -d "$training_dir" ]; then
              /usr/local/bin/docker-compose -p "user${user_id}" down --remove-orphans 2>/dev/null || \
              for c in "user${user_id}_controller" "user${user_id}_node1" "user${user_id}_node2" "user${user_id}_node3" "user${user_id}_lb"; do
                podman stop "$c" 2>/dev/null; podman rm -f "$c" 2>/dev/null
              done
              podman network rm "user${user_id}_ansible_net" 2>/dev/null || true
            fi
            rm -rf "/opt/training/user${user_id}"
          environment:
            DOCKER_HOST: "unix:///run/podman/podman.sock"
          loop: "{{ delete_alloc_results.results | selectattr('rc', 'eq', 0) | list }}"
          loop_control:
            label: "{{ item.item }}"
          changed_when: true

        - name: 削除対象ユーザーの allocation を release
          ansible.builtin.command:
            argv:
              - python3
              - "{{ allocate_script }}"
              - --username
              - "{{ item.item }}"
              - --action
              - release
          loop: "{{ delete_alloc_results.results | selectattr('rc', 'eq', 0) | list }}"
          loop_control:
            label: "{{ item.item }}"
          changed_when: true
          failed_when: false

    - name: 不要なユーザーアカウントを削除
      ansible.builtin.user:
        name: "{{ item }}"
        state: absent
        remove: true
      loop: "{{ users_to_delete }}"

    - name: 削除ユーザーの credential CSV を削除（リモート）
      ansible.builtin.file:
        path: "/opt/airgap/credentials/{{ item }}.csv"
        state: absent
      loop: "{{ users_to_delete }}"

    # =========================================================
    # Phase 5: パスワード検証（維持対象ユーザー）
    # =========================================================

    - name: 既存ユーザーのパスワード一致を確認
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import crypt, sys
            username, password = sys.argv[1], sys.argv[2]
            with open('/etc/shadow') as f:
                for line in f:
                    parts = line.strip().split(':')
                    if parts[0] == username:
                        h = parts[1]
                        if not h or h in ('!', '!!', '*'):
                            print('MISMATCH')
                            sys.exit(0)
                        if crypt.crypt(password, h) == h:
                            print('MATCH')
                        else:
                            print('MISMATCH')
                        sys.exit(0)
            print('NOUSER')
          - "{{ item.linux_user }}"
          - "{{ item.password }}"
      register: pw_checks
      loop: "{{ final_trainees | selectattr('linux_user', 'in', users_to_keep) | list }}"
      loop_control:
        label: "{{ item.linux_user }}"
      changed_when: false
      no_log: true

    - name: パスワード不一致ユーザーを特定
      ansible.builtin.set_fact:
        users_password_mismatch: >-
          {{
            pw_checks.results | default([])
            | selectattr('stdout', 'defined')
            | selectattr('stdout', 'equalto', 'MISMATCH')
            | map(attribute='item')
            | map(attribute='linux_user')
            | list
          }}

    - name: パスワード不一致を報告
      ansible.builtin.debug:
        msg: "パスワード更新対象: {{ users_password_mismatch | join(', ') }}"
      when: users_password_mismatch | length > 0

    # =========================================================
    # Phase 6: ユーザー作成・更新
    # =========================================================

    - name: ユーザーを作成・確認（グループ・コメント・ホーム）
      ansible.builtin.user:
        name: "{{ item.linux_user }}"
        password: "{{ item.password | password_hash('sha512') }}"
        groups: "{{ training_group }}"
        append: true
        shell: /bin/bash
        create_home: true
        comment: "{{ item.display_name | default(item.original_username) }}"
        update_password: on_create
      loop: "{{ final_trainees }}"
      loop_control:
        label: "{{ item.linux_user }}"

    - name: パスワード不一致ユーザーのパスワードを強制更新
      ansible.builtin.user:
        name: "{{ item.linux_user }}"
        password: "{{ item.password | password_hash('sha512') }}"
        update_password: always
      loop: "{{ final_trainees | selectattr('linux_user', 'in', users_password_mismatch) | list }}"
      loop_control:
        label: "{{ item.linux_user }}"
      when: users_password_mismatch | length > 0

    # =========================================================
    # Phase 7: per-user credential CSV 生成
    # =========================================================

    - name: /opt/airgap のパーミッションを確保
      ansible.builtin.file:
        path: /opt/airgap
        mode: '0755'
        state: directory

    - name: MOTD を配置
      ansible.builtin.copy:
        dest: /etc/motd
        mode: '0644'
        content: |
          === Ansible トレーニング環境 ===

          演習環境の操作:
            cd /opt/airgap
            ./deploy-training.sh           環境を作成
            ./deploy-training.sh status    環境の状態を確認
            ./deploy-training.sh destroy   環境を削除（再作成可能）

          問題が発生した場合は管理者にお問い合わせください。

    - name: credentials ディレクトリを作成（リモート）
      ansible.builtin.file:
        path: /opt/airgap/credentials
        state: directory
        mode: '0700'

    - name: ユーザーごとの credential CSV を生成（リモート）
      ansible.builtin.copy:
        dest: "/opt/airgap/credentials/{{ item.linux_user }}.csv"
        mode: '0600'
        content: |
          username,password,display_name
          {{ item.linux_user }},{{ item.password }},{{ item.display_name }}
      loop: "{{ final_trainees }}"
      loop_control:
        label: "{{ item.linux_user }}"
      no_log: true

    - name: credentials ディレクトリを作成（ローカル）
      ansible.builtin.file:
        path: "{{ credentials_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      run_once: true

    - name: ユーザーごとの credential CSV を生成（ローカル）
      ansible.builtin.copy:
        dest: "{{ credentials_dir }}/{{ item.linux_user }}.csv"
        mode: '0600'
        content: |
          username,password,display_name
          {{ item.linux_user }},{{ item.password }},{{ item.display_name }}
      loop: "{{ final_trainees }}"
      loop_control:
        label: "{{ item.linux_user }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: 削除ユーザーの credential CSV を削除（ローカル）
      ansible.builtin.file:
        path: "{{ credentials_dir }}/{{ item }}.csv"
        state: absent
      loop: "{{ users_to_delete }}"
      delegate_to: localhost
      become: false

    # =========================================================
    # Phase 8: 旧 credentials.csv の削除
    # =========================================================

    - name: 旧 credentials.csv を削除（リモート）
      ansible.builtin.file:
        path: /opt/airgap/credentials.csv
        state: absent

    - name: 旧 credentials.csv を削除（ローカル）
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../credentials.csv"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true

    # =========================================================
    # Phase 9: trainees.yml 更新（パスワード書き戻し）
    # =========================================================

    - name: trainees.yml にパスワード情報を書き戻し
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.template:
        src: trainees-updated.yml.j2
        dest: "{{ trainees_file }}"
        mode: '0600'

    # =========================================================
    # Phase 10: sshd AllowUsers 管理
    # =========================================================

    - name: 既存の AllowUsers 設定を検索
      ansible.builtin.shell: |
        grep -rh '^\s*AllowUsers' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null \
          | tail -1 || true
      register: existing_allowusers_raw
      changed_when: false

    - name: 既存の AllowUsers ユーザーリストをパース
      ansible.builtin.set_fact:
        existing_allow_users: >-
          {{
            existing_allowusers_raw.stdout
            | regex_replace('^\s*AllowUsers\s+', '')
            | split
            | select
            | list
            if existing_allowusers_raw.stdout | trim | length > 0
            else []
          }}

    - name: AllowUsers の更新リストを構築
      ansible.builtin.set_fact:
        updated_allow_users: >-
          {{
            (existing_allow_users | difference(users_to_delete) | list
             + desired_members)
            | unique | sort
          }}
      when: existing_allow_users | length > 0

    - name: AllowUsers 変更内容を表示
      ansible.builtin.debug:
        msg: |
          AllowUsers 管理:
            既存: {{ existing_allow_users | join(' ') }}
            追加: {{ desired_members | difference(existing_allow_users) | join(', ') or 'なし' }}
            削除: {{ users_to_delete | intersect(existing_allow_users) | join(', ') or 'なし' }}
            結果: {{ updated_allow_users | join(' ') }}
      when: existing_allow_users | length > 0

    - name: sshd AllowUsers を更新
      ansible.builtin.copy:
        dest: "{{ sshd_allowusers_conf }}"
        mode: '0644'
        content: |
          # Managed by setup-trainees.yml — 手動で追加したユーザーも保持されます
          AllowUsers {{ updated_allow_users | join(' ') }}
      register: sshd_config_changed
      when: existing_allow_users | length > 0

    - name: AllowUsers 未設定のため sshd 変更をスキップ
      ansible.builtin.debug:
        msg: "AllowUsers が sshd に設定されていないため、変更をスキップしました"
      when: existing_allow_users | length == 0

    - name: sshd を再読み込み
      ansible.builtin.systemd:
        name: sshd
        state: reloaded
      when:
        - existing_allow_users | length > 0
        - sshd_config_changed.changed

    # =========================================================
    # Phase 11: 結果表示
    # =========================================================

    - name: 管理結果を表示
      ansible.builtin.debug:
        msg: |
          === 受講者ユーザー管理完了 ===

          作成: {{ users_to_create | length }} 名
          {% for u in users_to_create %}
            - {{ u }}
          {% endfor %}

          パスワード更新: {{ users_password_mismatch | length }} 名
          {% for u in users_password_mismatch %}
            - {{ u }}
          {% endfor %}

          削除: {{ users_to_delete | length }} 名
          {% for u in users_to_delete %}
            - {{ u }}
          {% endfor %}

          維持（変更なし）: {{ (users_to_keep | difference(users_password_mismatch)) | length }} 名

          credential CSV: {{ credentials_dir }}/
          trainees.yml: パスワード追記済み

          次のステップ:
            各ユーザーの CSV を配布してください。
            例: credentials/<ユーザー名>.csv
          ============================
