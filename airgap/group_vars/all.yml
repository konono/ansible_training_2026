---
# デプロイモードを決める変数（airgap_mode / container_image_mode /
# training_source_mode など）は、ここではなく inventory 側で指定すること。
# このファイルは各 playbook の vars_files で読み込まれており、
# vars_files は inventory 変数より優先順位が高いため、ここに書くと
# inventory/hosts-online.yml の設定を上書きしてしまう。
#
#   airgap   : inventory/hosts.yml        （airgap_mode: true、既定）
#   非airgap : inventory/hosts-online.yml （airgap_mode: false）
#
# 既定値は各ロールの defaults/main.yml にある（未指定なら airgap 動作）。

# RHEL VM バージョン設定 — rhel-version.conf と同期すること
rhel_version: "9.4"
rhel_major: "{{ rhel_version.split('.')[0] }}"
rhel_iso_filename: "rhel-{{ rhel_version }}-x86_64-dvd.iso"
rhel_qcow2_filename: "rhel-{{ rhel_version }}-x86_64-kvm.qcow2"
rhel_installer_iso: "/opt/rhel{{ rhel_major }}.iso"
rhel_os_variant: "rhel{{ rhel_major }}.0"

bundle_staging_dir: /opt/airgap-bundle
training_base_dir: /opt/training
ubi10_repo_dir: /opt/ubi10-repos
ubi10_repo_enabled: true
packages_dir: /opt/packages

repo_server_ip: "{{ hostvars[groups['repo_server'][0]]['ansible_host'] if (groups.get('repo_server', []) | length > 0) else '' }}"

controller_image: "training-controller:latest"
node_image: "training-linux-node:latest"
