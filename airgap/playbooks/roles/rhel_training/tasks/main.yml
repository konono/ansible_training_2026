---
- name: training グループを作成
  ansible.builtin.group:
    name: training
    state: present
  tags: [training-group, sync-code]

- name: airgap コード配置ディレクトリを作成
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/airgap
    - /opt/airgap/scripts
  tags: sync-code

- name: 採番スクリプトを配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/allocate.py"
    dest: /opt/airgap/scripts/allocate.py
    mode: '0755'
  tags: sync-code

- name: デプロイスクリプトを配置
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/opt/airgap/{{ item.dest }}"
    mode: '0755'
  loop:
    - { src: "{{ playbook_dir }}/../deploy-training.sh", dest: "deploy-training.sh" }
    - { src: "{{ playbook_dir }}/../destroy-training.sh", dest: "destroy-training.sh" }
  tags: sync-code

- name: Playbook・ロール・設定を配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/"
    dest: /opt/airgap/playbooks/
    mode: preserve
  tags: sync-code

- name: インベントリを配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../inventory/"
    dest: /opt/airgap/inventory/
    mode: preserve
  tags: sync-code

- name: group_vars を配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../group_vars/"
    dest: /opt/airgap/group_vars/
    mode: preserve
  tags: sync-code

- name: ansible.cfg を配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../ansible.cfg"
    dest: /opt/airgap/ansible.cfg
    mode: '0644'
  tags: sync-code

- name: Python バージョンを確認
  ansible.builtin.command: python3 --version
  register: python3_version
  changed_when: false

- name: python3.12 をインストール（RHEL 9 の場合）
  ansible.builtin.dnf:
    name:
      - python3.12
      - python3.12-pip
    state: present
  when: "'3.9' in python3_version.stdout or '3.11' in python3_version.stdout"

- name: python3-pip をインストール
  ansible.builtin.dnf:
    name: python3-pip
    state: present
  when: "'3.12' in python3_version.stdout or '3.13' in python3_version.stdout"

- name: pip で使用する実行ファイルを決定
  ansible.builtin.set_fact:
    pip_executable: "{{ 'pip3.12' if ('3.9' in python3_version.stdout or '3.11' in python3_version.stdout) else 'pip3' }}"
    python_cmd: "{{ 'python3.12' if ('3.9' in python3_version.stdout or '3.11' in python3_version.stdout) else 'python3' }}"

- name: 既存の sudo secure_path を取得
  ansible.builtin.shell: sed -n 's/^[[:space:]]*Defaults[[:space:]]*secure_path[[:space:]]*=[[:space:]]*//p' /etc/sudoers /etc/sudoers.d/* 2>/dev/null | tail -1
  register: current_secure_path
  changed_when: false
  failed_when: false

- name: sudo の secure_path に /usr/local/bin を追加
  ansible.builtin.copy:
    dest: /etc/sudoers.d/local-path
    content: "Defaults secure_path = /usr/local/bin:{{ current_secure_path.stdout | default('/sbin:/bin:/usr/sbin:/usr/bin', true) }}\n"
    mode: '0440'
    validate: 'visudo -cf %s'
  when: "'/usr/local/bin' not in (current_secure_path.stdout | default(''))"

- name: pip のスクリプトインストール先を取得
  ansible.builtin.command: "{{ python_cmd }} -c \"import sysconfig; print(sysconfig.get_path('scripts'))\""
  register: pip_script_dir
  changed_when: false

- name: ansible-playbook がインストール済みか確認
  ansible.builtin.command: ansible-playbook --version
  register: ansible_check
  changed_when: false
  failed_when: false
  environment:
    PATH: "{{ pip_script_dir.stdout }}:{{ ansible_facts['env']['PATH'] }}"

- name: ansible-core をオフラインインストール
  ansible.builtin.pip:
    name: ansible-core
    extra_args: "--no-index --find-links={{ bundle_staging_dir }}/pip-packages/"
    executable: "{{ pip_executable }}"
  when: ansible_check.rc != 0

- name: Ansible コレクションを配置
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../offline-resources/ansible-collections/"
    dest: /opt/airgap/offline-resources/ansible-collections/
    mode: '0644'

- name: Ansible コレクションをインストール
  ansible.builtin.shell: |
    for f in /opt/airgap/offline-resources/ansible-collections/*.tar.gz; do
      ansible-galaxy collection install "$f" --force
    done
  when: ansible_check.rc != 0
  changed_when: true
  environment:
    PATH: "{{ pip_script_dir.stdout }}:{{ ansible_facts['env']['PATH'] }}"

- name: コントローライメージをロード
  ansible.builtin.command:
    cmd: podman load -i {{ container_images_dir }}/training-controller.tar
  register: controller_load
  changed_when: "'Loaded image' in controller_load.stdout"

- name: Linuxノードイメージをロード
  ansible.builtin.command:
    cmd: podman load -i {{ container_images_dir }}/training-linux-node.tar
  register: node_load
  changed_when: "'Loaded image' in node_load.stdout"

- name: ロード済みイメージを確認
  ansible.builtin.command: podman images
  register: loaded_images
  changed_when: false

- name: ロード済みイメージ一覧を表示
  ansible.builtin.debug:
    msg: "{{ loaded_images.stdout_lines }}"

- name: /opt/training ディレクトリを作成
  ansible.builtin.file:
    path: /opt/training
    state: directory
    mode: '0755'
  tags: [training-group, sync-code]

- name: allocations.json のパーミッションを設定（存在する場合）
  ansible.builtin.file:
    path: /opt/training/allocations.json
    mode: '0644'
  failed_when: false
  changed_when: false
  tags: [training-group, sync-code]

- name: MOTD を配置
  ansible.builtin.copy:
    dest: /etc/motd
    mode: '0644'
    content: |
      === Ansible トレーニング環境 ===

      演習環境の操作:
        cd /opt/airgap
        ./deploy-training.sh           環境を作成
        ./deploy-training.sh status    環境の状態を確認
        ./deploy-training.sh destroy   環境を削除（再作成可能）

      問題が発生した場合は管理者にお問い合わせください。
  tags: [training-group, sync-code]

- name: セットアップ完了
  ansible.builtin.debug:
    msg: |
      ========================================
      Linux 演習サーバーの基盤セットアップが完了しました。

      コンテナイメージ: ロード済み
      スクリプト: /opt/airgap/deploy-training.sh
      Playbook: /opt/airgap/playbooks/deploy-my-env.yml

      受講者は SSH でこのサーバーにログインし、
      ./deploy-training.sh を実行して各自の演習環境を構築してください。
      ========================================
