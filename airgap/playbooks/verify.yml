---
- name: 研修環境の動作確認（RHEL）
  hosts: rhel
  become: true
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/rhel.yml

  tasks:
    - name: podman が動作しているか確認
      ansible.builtin.command: podman --version
      register: podman_ver
      changed_when: false

    - name: podman バージョンを表示
      ansible.builtin.debug:
        msg: "{{ podman_ver.stdout }}"

    - name: 起動中のコンテナを確認
      ansible.builtin.command: podman ps --format "{% raw %}{{.Names}}{% endraw %}"
      register: running_containers
      changed_when: false

    - name: コンテナ一覧を表示
      ansible.builtin.debug:
        msg: "{{ running_containers.stdout_lines }}"

    - name: 割当状況を確認
      ansible.builtin.command: python3 /opt/airgap/scripts/allocate.py --action status
      register: alloc_status
      changed_when: false
      failed_when: false

    - name: 割当状況を表示
      ansible.builtin.debug:
        msg: "{{ alloc_status.stdout | from_json }}"
      when: alloc_status.rc == 0

    - name: active ユーザーの ID を取得
      ansible.builtin.shell: |
        python3 /opt/airgap/scripts/allocate.py --action status | python3 -c "
        import json, sys
        data = json.load(sys.stdin)
        for a in data['allocations']:
            if a['status'] == 'active':
                print(a['user_id'])
        "
      register: active_uids
      changed_when: false

    - name: active ユーザーのコンテナを検証
      ansible.builtin.shell: |
        missing=""
        for name in controller node1 node2 node3 lb; do
          podman ps --format '{% raw %}{{.Names}}{% endraw %}' | grep -q "^user{{ item }}_${name}$" || missing="$missing user{{ item }}_${name}"
        done
        if [ -n "$missing" ]; then
          echo "MISSING:$missing"
        else
          echo "user{{ item }}: all 5 containers running"
        fi
      loop: "{{ active_uids.stdout_lines }}"
      register: verify_results
      changed_when: false

    - name: 検証結果を表示
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ verify_results.results }}"
      loop_control:
        label: "user{{ item.item }}"

    - name: 停止中のコンテナがある場合は警告
      ansible.builtin.fail:
        msg: "停止中のコンテナがあります: {{ item.stdout }}"
      loop: "{{ verify_results.results }}"
      loop_control:
        label: "user{{ item.item }}"
      when: "'MISSING:' in item.stdout"
