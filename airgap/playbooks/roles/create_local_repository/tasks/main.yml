---
- name: Install nginx (only when serving over HTTP)
  ansible.builtin.yum:
    name: "{{ nginx_package_name }}"
    state: present
  become: true

- name: Serve the ISO mount via nginx (only when serving over HTTP)
  ansible.builtin.blockinfile:
    path: "{{ nginx_repo_config_path }}"
    create: true
    block: |
      server {
          listen       {{ nginx_listen_port }};
          server_name  {{ nginx_server_name }};
          location {{ nginx_repo_location }} {
              alias {{ iso_mount_point }}/;
              autoindex {{ nginx_autoindex }};
          }
          {% if ubi10_repo_enabled | default(true) %}
          location /ubi10/ {
              alias {{ ubi10_repo_dir }}/;
              autoindex on;
          }
          {% endif %}
          location /packages/ {
              alias {{ packages_dir }}/;
              autoindex on;
          }
      }
  become: true

- name: Ensure nginx is running and enabled (only when serving over HTTP)
  ansible.builtin.service:
    name: "{{ nginx_service_name }}"
    state: "{{ nginx_service_state }}"
    enabled: "{{ nginx_service_enabled }}"
  become: true

- name: Check if firewalld is active
  ansible.builtin.command:
    cmd: systemctl is-active firewalld
  register: firewalld_active
  changed_when: false
  failed_when: false
  become: true

- name: Open HTTP service in firewall (permanent)
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-service={{ firewall_service_name }}"
  when: firewalld_active.rc == 0
  register: firewall_open_http
  changed_when: firewall_open_http.rc == 0
  become: true

- name: Reload firewall
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  when: firewalld_active.rc == 0
  changed_when: true
  become: true
