---
- name: 研修環境の動作確認（RHEL）
  hosts: rhel
  become: true
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/rhel.yml

  tasks:
    - name: podman が動作しているか確認
      ansible.builtin.command: podman --version
      register: podman_ver
      changed_when: false

    - name: 研修コンテナが全て起動しているか確認
      ansible.builtin.shell: |
        missing=""
        for name in controller node1 node2 node3 lb; do
          podman ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -q "^${name}$" || missing="${missing} ${name}"
        done
        echo "${missing:-all_running}"
      register: containers
      changed_when: false

    - name: 起動中のコンテナを確認
      ansible.builtin.assert:
        that:
          - "'all_running' in containers.stdout"
        fail_msg: "停止中のコンテナがあります:{{ containers.stdout }}"
        success_msg: "全てのコンテナ (controller, node1-3, lb) が起動しています"

    - name: コントローラSSHポートへの接続を確認
      ansible.builtin.wait_for:
        host: localhost
        port: 2220
        timeout: 10
        state: started

    - name: コントローラ内からノードへのping確認
      ansible.builtin.command: >
        podman exec controller bash -c
        "echo 'password' | sshpass -p 'password' ssh -o StrictHostKeyChecking=no root@172.20.0.{{ item }} cat /etc/hostname"
      loop:
        - 11
        - 12
        - 13
        - 14
      register: ping_results
      changed_when: false
      failed_when: ping_results.rc != 0

    - name: ノード接続結果を表示
      ansible.builtin.debug:
        msg: "172.20.0.{{ item.item }} -> SSH OK (rc={{ item.rc }})"
      loop: "{{ ping_results.results }}"
      loop_control:
        label: "172.20.0.{{ item.item }}"

    - name: 検証完了
      ansible.builtin.debug:
        msg: "全ての検証が完了しました。研修環境は正常に動作しています。"

- name: 研修環境の動作確認（Windows）
  hosts: windows
  gather_facts: false
  tasks:
    - name: podman が動作しているか確認
      ansible.windows.win_shell: podman --version 2>$null
      register: win_podman_ver
      changed_when: false

    - name: コンテナの状態を確認
      ansible.builtin.raw: podman --remote ps
      register: win_containers
      changed_when: false

    - name: コンテナ状態を表示
      ansible.builtin.debug:
        msg: "{{ win_containers.stdout_lines }}"

    - name: コントローラSSHポートへの接続を確認
      ansible.builtin.raw: netstat -an | findstr "2220.*LISTENING"
      register: win_ssh_wait
      until: win_ssh_wait.rc == 0
      retries: 6
      delay: 5
      changed_when: false

    - name: 検証完了
      ansible.builtin.debug:
        msg: "全ての検証が完了しました。研修環境は正常に動作しています。"
