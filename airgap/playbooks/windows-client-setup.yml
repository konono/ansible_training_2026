---
- name: Windows クライアント端末セットアップ（nested VM 不可の場合）
  hosts: windows_clients
  gather_facts: false
  become: false

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/windows_clients.yml

  pre_tasks:
    - name: SSH 接続確認
      ansible.windows.win_ping:

    - name: OS 情報を取得
      ansible.windows.win_shell: (Get-CimInstance Win32_OperatingSystem).Caption
      register: os_check
      changed_when: false

    - name: OS が Windows であることを確認
      ansible.builtin.assert:
        that:
          - "'Windows' in os_check.stdout"
        fail_msg: "このPlaybookはWindows OSでのみ実行可能です"

  roles:
    - win_client_ssh
    - win_client_vscode

  post_tasks:
    - name: セットアップ完了メッセージ
      ansible.builtin.debug:
        msg: |
          ========================================
          Windows クライアントのセットアップが完了しました！

          ■ 研修環境の構築:
            1. training サーバーに SSH 接続:
               ssh root@{{ rhel_target_ip | default('<training サーバー IP>') }}
            2. 演習環境をデプロイ:
               cd /opt/airgap && ./deploy-training.sh
            3. 表示されたポート番号で接続:
               ssh -p <ポート番号> root@{{ rhel_target_ip | default('<training サーバー IP>') }}
               パスワード: {{ controller_password }}

          ■ VSCode で接続する場合:
            Ctrl+Shift+P → "Remote-SSH: Connect to Host"
            → root@<IP> -p <ポート番号> と入力
          ========================================
